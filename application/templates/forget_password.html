{% extends "base.html" %}

{% block title %}
<title>HRM Application - Reset Password</title>
{% endblock %}

{% block stylecss %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/custom/login.css') }}">
<style>
    .error-message {
        color: red;
        font-size: 14px;
        margin-bottom: 15px;
    }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="login-container">
        <img class="img-fluid rounded-3" src="{{ url_for('static', filename='images/logo.png') }}" alt="HRM Logo">
        <h2 class="login-title">HRM</h2>

        <!-- Display dynamic alerts -->
        <div id="alert-container"></div>

        <form method="POST" id="reset-password-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="email">Nhập Email đã đăng ký</label>
                <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Nhập email của bạn"
                        required
                >
            </div>
            <button type="submit" class="btn btn-primary mt-3">Gửi liên kết đặt lại</button>
        </form>

        <div class="text-end mt-2">
            <a href="{{ url_for('users.login') }}" class="reset-password-link text-small">
                Quay lại trang đăng nhập
            </a>
        </div>
        <p class="footer">© 2024 HRM Application. All rights reserved.</p>
    </div>
</div>

<script>
    document.getElementById("reset-password-form").addEventListener("submit", function (event) {
        event.preventDefault(); // Prevent default form submission

        const form = event.target;
        const email = form.querySelector("#email").value;
        const csrfToken = form.querySelector('input[name="csrf_token"]').value;
        const submitButton = form.querySelector("button");

        // Disable the button and show loading state
        submitButton.disabled = true;
        submitButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Đang gửi...';

        // Prepare the request payload
        const payload = {
            email: email,
            csrf_token: csrfToken,
        };

        // Send the request
        fetch("/forget_password", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrfToken,
            },
            body: JSON.stringify(payload),
        })
            .then((response) => {
                console.log("Response Status:", response.status);
                return response.json();
            })
            .then((data) => {
                // Remove any existing alerts
                document.querySelectorAll(".alert").forEach((alert) => alert.remove());

                if (data.success) {
                    // Show success alert
                    const successAlert = document.createElement("div");
                    successAlert.className = "alert alert-success mt-3";
                    successAlert.textContent = data.message;
                    form.append(successAlert);

                    // Reset the form
                    form.reset();

                    // Remove the alert after 5 seconds
                    setTimeout(() => successAlert.remove(), 5000);
                } else {
                    // Show error alert
                    const errorAlert = document.createElement("div");
                    errorAlert.className = "alert alert-danger mt-3";
                    errorAlert.textContent = data.message || "Có lỗi xảy ra. Vui lòng thử lại.";
                    form.append(errorAlert);

                    // Remove the alert after 5 seconds
                    setTimeout(() => errorAlert.remove(), 5000);
                }
            })
            .catch((error) => {
                console.error("Error:", error);
                const errorAlert = document.createElement("div");
                errorAlert.className = "alert alert-danger mt-3";
                errorAlert.textContent = "Có lỗi xảy ra khi gửi yêu cầu. Vui lòng thử lại sau.";
                form.append(errorAlert);

                // Remove the alert after 5 seconds
                setTimeout(() => errorAlert.remove(), 5000);
            })
            .finally(() => {
                // Re-enable the button and reset text
                submitButton.disabled = false;
                submitButton.innerHTML = "Gửi liên kết đặt lại";
            });
    });
</script>

{% endblock %}
