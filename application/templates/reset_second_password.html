{% extends "member_base.html" %}

{% block stylecss %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/custom/reset_second_password.css') }}">
<style>
    body {
        background-color: #f4f4f9;
    }
    .content {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .reset-password-container {
        background-color: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        padding: 30px;
        width: 100%;
        max-width: 400px;
    }
    .reset-password-container h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        font-weight: bold;
        color: #555;
    }
    .form-group input {
        border-radius: 5px;
        padding: 10px;
        font-size: 16px;
    }
    .form-group .error-message {
        color: red;
        font-size: 14px;
        margin-top: 5px;
    }
    .buttons {
        display: flex;
        justify-content: space-between;
    }
    .btn {
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 5px;
    }
    .btn-cancel {
        background-color: #d9534f;
        color: white;
        border: none;
    }
    .btn-cancel:hover {
        background-color: #c9302c;
    }
    .btn-confirm {
        background-color: #5cb85c;
        color: white;
        border: none;
    }
    .btn-confirm:hover {
        background-color: #4cae4c;
    }
</style>
{% endblock %}

{% block title %}
<title>HRM - Reset Second Password</title>
{% endblock %}

{% block content %}
<div class="content">
    <div class="reset-password-container">
        <h2>Reset Second Password</h2>
        <form id="reset-password-form" method="POST" action="{{ url_for('core.reset_second_password', token=token) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token_value }}">
            <input type="hidden" name="loginId" value="{{ loginId }}">
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input
                        type="password"
                        id="new_password"
                        name="new_password"
                        class="form-control"
                        required
                        placeholder="Enter your new password"
                />
                <span id="password-error" class="error-message"></span>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        class="form-control"
                        required
                        placeholder="Confirm your new password"
                />
                <span id="confirm-password-error" class="error-message"></span>
            </div>
            <div class="buttons">
                <button type="submit" class="btn btn-confirm">Confirm</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block stylejs %}
<script>
    document.getElementById("reset-password-form").addEventListener("submit", function (event) {
        event.preventDefault(); // Prevent default form submission

        const form = event.target;
        const formData = new FormData(form);
        const submitButton = form.querySelector(".btn-confirm");
        const formInputs = form.querySelectorAll("input, textarea, select");

        // Disable form inputs and submit button to prevent multiple submissions
        toggleFormState(formInputs, submitButton, true);

        const csrfToken = formData.get("csrf_token");
        const newPassword = formData.get("new_password");
        const confirmPassword = formData.get("confirm_password");

        // Clear previous error messages
        const passwordError = document.getElementById("password-error");
        const confirmPasswordError = document.getElementById("confirm-password-error");
        passwordError.textContent = "";
        confirmPasswordError.textContent = "";

        // Validate passwords
        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
        if (!passwordRegex.test(newPassword)) {
            passwordError.textContent =
                "Password must be at least 8 characters long and include a mix of uppercase, lowercase, numbers, and special characters.";
            toggleFormState(formInputs, submitButton, false);
            return;
        }

        if (newPassword !== confirmPassword) {
            confirmPasswordError.textContent = "Passwords do not match.";
            toggleFormState(formInputs, submitButton, false);
            return;
        }

        // Send AJAX request to the server
        fetch(form.action, {
            method: "POST",
            headers: {
                "X-CSRFToken": csrfToken,
                "Content-Type": "application/x-www-form-urlencoded",
            },
            body: new URLSearchParams(formData),
        })
            .then((response) => response.json())
            .then((data) => {
                if (data.success) {
                    // Show success alert
                    alert(data.message);

                    // Redirect to profile page
                    const loginId = document.querySelector('input[name="loginId"]').value;
                    setTimeout(() => {
                        window.location.href = "/soldier_info_personal_user/" + loginId;
                    }, 3000);
                } else {
                    alert(data.message || "An unexpected error occurred.");
                    toggleFormState(formInputs, submitButton, false);
                }
            })
            .catch((error) => {
                console.error("Error submitting form:", error);
                alert("An error occurred while updating the password. Please try again.");
                toggleFormState(formInputs, submitButton, false);
            });
    });

    // Helper function to enable/disable form inputs and buttons
    function toggleFormState(inputs, submitButton, disable) {
        inputs.forEach((input) => {
            input.disabled = disable;
        });
        submitButton.disabled = disable;
        submitButton.innerHTML = disable
            ? '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Processing...'
            : "Confirm";
    }
</script>
{% endblock %}
