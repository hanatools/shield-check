<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unauthorized Access</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }
        .unauthorized-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 6px 20px rgba(0, 0, 0, 0.15);
            animation: fadeIn 0.5s ease-in-out;
        }
        .unauthorized-container i {
            font-size: 50px;
            color: #dc3545;
            margin-bottom: 20px;
        }
        .unauthorized-container h1 {
            font-size: 2.5rem;
            color: #212529;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .unauthorized-container p {
            color: #6c757d;
            font-size: 1.2rem;
            margin-bottom: 25px;
        }
        .unauthorized-container a {
            text-decoration: none;
            color: white;
            background-color: #007bff;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }
        .unauthorized-container a:hover {
            background-color: #0056b3;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
<div class="unauthorized-container">
    <i class="fa-solid fa-ban"></i>
    <h1>Truy Cập Bị Từ Chối</h1>
    <p>Bạn không có quyền truy cập vào chức năng này. Vui lòng kiểm tra với quản trị viên.</p>
    <a href="{{ url_for('core.index') }}"> Trở về Trang Chủ</a>
</div>
</body>
</html>
